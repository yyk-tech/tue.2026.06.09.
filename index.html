<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기술·가정 안전실습실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#6C5CE7; --secondary:#00B4D8; --accent:#FF6B6B;
  --bg:#F8F7FF; --white:#FFFFFF; --text:#1A1A2E; --muted:#888; --border:#E8E4FF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAV */
.topnav{background:var(--white);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(108,92,231,0.08);}
.topnav-inner{max-width:1100px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer;}
.logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo-name{font-size:13px;font-weight:900;}
.logo-sub{font-size:10px;color:var(--muted);}
.nav-tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;position:relative;border:none;background:none;font-family:inherit;}
.nav-tab:hover{color:var(--primary);background:rgba(108,92,231,.06);}
.nav-tab.active{color:var(--primary);font-weight:700;}
.nav-tab.active::after{content:'';position:absolute;bottom:-2px;left:13px;right:13px;height:2px;background:var(--primary);border-radius:2px;}
.nbadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;border-radius:50%;margin-left:3px;vertical-align:middle;}
.btn-nav{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;background:var(--primary);border:none;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.btn-nav.ghost{background:#f1f0ff;color:var(--primary);}

/* HERO */
.hero{background:linear-gradient(135deg,#EDE9FF 0%,#E0F7FF 50%,#FFE9E9 100%);padding:52px 20px;text-align:center;}
.hero-inner{max-width:680px;margin:0 auto;}
.hero-tag{display:inline-block;background:rgba(108,92,231,.12);color:var(--primary);font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:.06em;margin-bottom:14px;}
.hero-title{font-size:clamp(22px,5vw,36px);font-weight:900;line-height:1.3;margin-bottom:10px;}
.hero-title span{color:var(--primary);}
.hero-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-hp{padding:11px 24px;background:var(--primary);color:#fff;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.btn-ho{padding:11px 24px;background:transparent;color:var(--primary);border:2px solid var(--primary);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:32px 16px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--white);border-radius:14px;padding:18px;border:1.5px solid var(--border);text-align:center;}
.stat-num{font-size:26px;font-weight:900;color:var(--primary);}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px;}

/* CARDS */
.card-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
@media(max-width:700px){.card-row{grid-template-columns:1fr;}}
.card{background:var(--white);border-radius:16px;padding:22px;border:1.5px solid var(--border);cursor:pointer;transition:all .25s;}
.card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 8px 24px rgba(108,92,231,.12);}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;}
.ci-purple{background:#F0EDFF;} .ci-cyan{background:#E0F7FF;} .ci-pink{background:#FFE9E9;}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.card-arrow{margin-top:12px;font-size:12px;color:var(--primary);font-weight:700;}

/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.sec-bar{width:4px;height:18px;background:var(--primary);border-radius:2px;}
.more{font-size:12px;color:var(--muted);cursor:pointer;}

/* NOTICE LIST */
.nlist{background:var(--white);border-radius:14px;border:1.5px solid var(--border);overflow:hidden;}
.nitem{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);gap:10px;cursor:pointer;transition:background .15s;}
.nitem:last-child{border:none;}
.nitem:hover{background:#F8F7FF;}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0;}
.ntitle{flex:1;font-size:13px;}
.nnew{background:#FFE9E9;color:var(--accent);font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;}
.ndate{font-size:11px;color:var(--muted);white-space:nowrap;}

/* BOARD */
.bhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.btable{background:var(--white);border-radius:14px;border:1.5px solid var(--border);overflow:hidden;}
.brow{display:grid;grid-template-columns:50px 1fr 70px 80px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background .15s;}
.brow:hover{background:#F8F7FF;}
.brow:last-child{border:none;}
.brow.bhead-row{background:#f3f0ff;font-size:11px;font-weight:700;color:var(--muted);cursor:default;}
.brow.bhead-row:hover{background:#f3f0ff;}

/* DETAIL */
.dbox{background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:28px;margin-bottom:16px;}
.dtitle{font-size:20px;font-weight:700;margin-bottom:8px;}
.dmeta{font-size:12px;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.dcontent{font-size:14px;line-height:1.9;white-space:pre-wrap;}

/* FORM */
.fbox{background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:28px;}
.flabel{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.finput{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border .2s;}
.finput:focus{border-color:var(--primary);background:var(--white);}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .2s;}
.btn-p{background:var(--primary);color:#fff;}
.btn-p:hover{background:#5b4dd1;}
.btn-o{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.btn-d{background:var(--accent);color:#fff;}
.btn-s{padding:6px 14px;font-size:12px;}
.btn-back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;margin-bottom:16px;}

/* SAFETY */
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-bottom:20px;}
.progress-fill{height:6px;background:var(--primary);border-radius:3px;transition:width .4s;}
.qopt{width:100%;text-align:left;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:13px;font-family:inherit;background:var(--white);transition:all .2s;}
.qopt:hover{border-color:var(--primary);background:#F0EDFF;}
.license-card{border:3px solid var(--primary);border-radius:20px;padding:32px;background:linear-gradient(135deg,#EDE9FF,var(--white));text-align:center;margin-bottom:20px;}
.chat-u{background:var(--primary);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:75%;margin-left:auto;font-size:13px;}
.chat-a{background:var(--white);border:1.5px solid var(--border);border-radius:18px 18px 18px 4px;padding:12px 14px;max-width:82%;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.06);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.mbox{background:var(--white);border-radius:20px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(108,92,231,.2);}

/* MISC */
.ptitle{font-size:22px;font-weight:900;margin-bottom:6px;}
.psub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.tp{background:#F0EDFF;color:var(--primary);}
.tc{background:#E0F7FF;color:var(--secondary);}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;}
.fade-in{animation:fi .2s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

// ─── UTILS ────────────────────────────────────────────
function parseSid(sid){
  if(!sid||sid.length!==5||!/^\d+$/.test(sid))return null;
  return{grade:sid[0],cls:parseInt(sid.slice(1,3)),num:parseInt(sid.slice(3,5))};
}
function fmtSid(sid){const p=parseSid(sid);return p?`${p.grade}학년 ${p.cls}반 ${p.num}번`:'잘못된 학번';}
function nt(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
function nd(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function tname(id){for(const c of Object.values(TOOLS_DATA)){const t=c.items.find(i=>i.id===id);if(t)return t.name;}return id;}
function fqs(){return S.selectedTools.length?QUESTIONS.filter(q=>S.selectedTools.includes(q.tool)):QUESTIONS;}
function isNew(d){return d&&(Date.now()-new Date(d).getTime())<7*86400000;}
function nextId(a){return a.length?Math.max(...a.map(i=>i.id))+1:1;}
function fdate(s){return s?s.slice(5).replace('-','/'):''}

function gradeEssay(model,ans){
  const kws=model.split(/[\s,。]+/).filter(w=>w.length>=2);
  const hit=kws.filter(k=>ans.includes(k)).length;
  const ok=hit>=Math.max(1,Math.floor(kws.length/3));
  return{ok,fb:ok?'핵심 내용을 잘 포함하고 있습니다.':'모범답안의 핵심 내용을 다시 확인하세요.'};
}

// ─── AI ───────────────────────────────────────────────
function mockAI(msg){
  for(const item of AI_MOCK){if(item.k.some(k=>msg.includes(k)))return item.r;}
  return DEFAULT_AI;
}
async function aiChat(msg,tools,history){
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,tools,history})});
    if(!res.ok)throw 0;return await res.json();
  }catch{return mockAI(msg);}
}
async function aiGrade(q,m,a){
  try{
    const res=await fetch('/api/grade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,modelAnswer:m,studentAnswer:a})});
    if(!res.ok)throw 0;return await res.json();
  }catch{const r=gradeEssay(m,a);return{correct:r.ok,feedback:r.fb};}
}

function vQuiz(){
  if(!S.quizState)S.quizState={questions:fqs(),current:0,score:0,wrong:[],fb:'',ok:false};
  const qs=S.quizState, st=S.students[S.currentSid];
  if(qs.current>=qs.questions.length){
    const pct=qs.score/qs.questions.length, pass=pct>=0.7;
    return`<div class="main" style="max-width:480px;text-align:center;padding-top:48px;">
      <div style="font-size:56px;margin-bottom:14px;">${pass?'🎉':'😢'}</div>

      ${pass
        ?`<button class="btn btn-p" style="width:100%;padding:14px;" onclick="quizPass()">🏅 면허증 발급받기 →</button>`
        :`<button class="btn btn-p" style="width:100%;padding:14px;background:var(--muted);" onclick="S.quizState=null;go('safety-quiz')">🔄 다시 도전하기</button>`}
    </div>`;
  }
  const q=qs.questions[qs.current];
  return`<div class="main" style="max-width:580px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <span style="font-size:14px;font-weight:700;">📝 안전 퀴즈 — ${st?.name}님</span>
      <span style="font-size:13px;color:var(--muted);">${qs.current+1}/${qs.questions.length}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${qs.current/qs.questions.length*100}%"></div></div>
    <div style="background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:28px;">
      <p style="font-size:16px;font-weight:700;margin-bottom:20px;">Q${qs.current+1}. ${q.text}</p>
      ${q.type==='mc'?(!qs.fb?q.options.map((o,i)=>`<button class="qopt" onclick="mcAns(${i})">${String.fromCharCode(9312+i)} ${o}</button>`).join(''):'')
      :(!qs.fb?`<textarea id="ess" rows="4" class="finput" placeholder="답변을 입력하세요..." style="margin-bottom:12px;"></textarea><button class="btn btn-p" onclick="essAns()">제출</button>`:'')}
      ${qs.fb?`
        <div style="padding:16px;border-radius:12px;${qs.ok?'background:#f0fdf4;color:#166534':'background:#fef2f2;color:#991b1b'};margin-bottom:16px;font-size:14px;">${qs.fb}</div>
        <button class="btn btn-p" style="width:100%;" onclick="nextQ()">다음 문제 →</button>`:''}
    </div>
  </div>`;
}

            <td style="padding:10px 12px;">${s.licensed?'✅':'❌'}</td>
            <td style="padding:10px 12px;">${(s.chatLog||[]).length}</td>
            <td style="padding:10px 12px;">${s.reflection?.submittedAt?'✅':'❌'}</td>
          </tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    </div>
  </div>`;
}

// ─── VIEW: MODAL ──────────────────────────────────────
function vModal(){
  if(S.modal==='auth')return`<div class="overlay" onclick="if(event.target===this)closeM()"><div class="mbox">
    <div style="font-size:22px;font-weight:900;margin-bottom:6px;">로그인</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:22px;">역할을 선택해 주세요</p>
    <div style="display:grid;gap:10px;">
      <button onclick="showM('student')" style="border:1.5px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;text-align:left;background:var(--bg);font-family:inherit;transition:all .2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="font-size:22px;margin-bottom:4px;">👨‍🎓</div>
        <div style="font-size:14px;font-weight:700;">학생으로 로그인</div>
        <div style="font-size:12px;color:var(--muted);">이름 + 학번으로 안전실습 참여</div>
      </button>
      <button onclick="showM('teacher')" style="border:1.5px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;text-align:left;background:var(--bg);font-family:inherit;transition:all .2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="font-size:22px;margin-bottom:4px;">👩‍🏫</div>
        <div style="font-size:14px;font-weight:700;">교사로 로그인</div>
        <div style="font-size:12px;color:var(--muted);">공지·자료 관리 + 수업 운영</div>
      </button>
    </div>
    <button onclick="closeM()" style="width:100%;margin-top:14px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit;">취소</button>
  </div></div>`;

  if(S.modal==='student')return`<div class="overlay" onclick="if(event.target===this)closeM()"><div class="mbox">
    <button onclick="showM('auth')" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;font-family:inherit;">← 뒤로</button>
    <div style="font-size:20px;font-weight:900;margin-bottom:18px;">👨‍🎓 학생 로그인</div>
    ${!S.classActive?`<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:13px;color:#92400e;margin-bottom:14px;">⏳ 아직 수업이 시작되지 않았습니다.</div>`:''}
    <div style="margin-bottom:14px;"><label class="flabel">이름</label><input id="s-n" class="finput" placeholder="홍길동"></div>
    <div style="margin-bottom:14px;"><label class="flabel">학번 (5자리)</label>
      <input id="s-s" class="finput" maxlength="5" placeholder="예) 10203" oninput="const p=parseSid(this.value);document.getElementById('sp').textContent=p?'→ '+fmtSid(this.value):(this.value.length===5?'⚠️ 잘못된 형식':'');">
      <p id="sp" style="font-size:12px;color:var(--primary);margin-top:4px;min-height:18px;"></p>
    </div>
    <p id="s-e" style="color:var(--accent);font-size:13px;display:none;margin-bottom:10px;"></p>
    <button class="btn btn-p" style="width:100%;padding:12px;" onclick="studentLogin()">입장하기</button>
  </div></div>`;

  if(S.modal==='teacher')return`<div class="overlay" onclick="if(event.target===this)closeM()"><div class="mbox">
    <button onclick="showM('auth')" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;font-family:inherit;">← 뒤로</button>
    <div style="font-size:20px;font-weight:900;margin-bottom:18px;">👩‍🏫 교사 로그인</div>
    <div style="margin-bottom:14px;"><label class="flabel">비밀번호</label>
      <input id="t-p" class="finput" type="password" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter')teacherLogin()">
    </div>
    <p id="t-e" style="color:var(--accent);font-size:13px;display:none;margin-bottom:10px;">비밀번호가 틀렸습니다.</p>
    <button class="btn btn-p" style="width:100%;padding:12px;" onclick="teacherLogin()">로그인</button>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:10px;">기본 비밀번호: teacher1234</p>
  </div></div>`;
  return'';
}

// ─── HANDLERS ─────────────────────────────────────────
function studentLogin(){
  const name=document.getElementById('s-n')?.value.trim();
  const sid=document.getElementById('s-s')?.value.trim();
  const err=document.getElementById('s-e');
  const show=m=>{err.textContent=m;err.style.display='block';};
  if(!name){show('이름을 입력하세요.');return;}
  if(!parseSid(sid)){show('학번은 5자리 숫자로 입력하세요.');return;}
  if(S.students[sid]&&S.students[sid].name!==name){show('이미 다른 이름으로 등록된 학번입니다.');return;}
  if(!S.students[sid]){
    const p=parseSid(sid);
    S.students[sid]={sid,name,grade:p.grade,cls:p.cls,num:p.num,
      quizScore:0,quizTotal:0,licensed:false,licenseDate:null,
      quizWrong:[],chatLog:[],step:'quiz',lastActive:Date.now()/1000,practiceStart:null,reflection:{}};
  }
  S.currentSid=sid; S.quizState=null; closeM(); go('safety-quiz');
}

function teacherLogin(){
  const pw=document.getElementById('t-p')?.value;
  if(pw==='teacher1234'){S.teacherAuthed=true;closeM();go('teacher-setup');}
  else document.getElementById('t-e').style.display='block';
}

function saveNotice(eid){
  const t=document.getElementById('n-t')?.value.trim();
  const c=document.getElementById('n-c')?.value.trim();
  const pin=document.getElementById('n-pin')?.checked;
  const err=document.getElementById('n-err');
  if(!t||!c){if(err){err.textContent='제목과 내용을 입력하세요.';err.style.display='block';}return;}
  if(eid!==null){const i=S.notices.findIndex(n=>n.id===eid);if(i>=0)S.notices[i]={...S.notices[i],title:t,content:c,isNotice:pin};}
  else S.notices.push({id:nextId(S.notices),title:t,content:c,author:'교사',date:nd(),isNotice:pin});
  go('notice');
}

function delNotice(id){if(!confirm('삭제하시겠습니까?'))return;S.notices=S.notices.filter(n=>n.id!==id);go('notice');}

function saveResource(eid){
  const t=document.getElementById('r-t')?.value.trim();
  const c=document.getElementById('r-c')?.value.trim();
  const l=document.getElementById('r-l')?.value.trim();
  const err=document.getElementById('r-err');
  if(!t){if(err){err.textContent='제목을 입력하세요.';err.style.display='block';}return;}
  if(eid!==null){const i=S.resources.findIndex(r=>r.id===eid);if(i>=0)S.resources[i]={...S.resources[i],title:t,content:c,link:l};}
  else S.resources.push({id:nextId(S.resources),title:t,content:c,link:l,author:'교사',date:nd()});
  go('resource');
}

function delResource(id){if(!confirm('삭제하시겠습니까?'))return;S.resources=S.resources.filter(r=>r.id!==id);go('resource');}

function mcAns(i){
  const qs=S.quizState, q=qs.questions[qs.current], ok=i===q.answer;
  if(ok){qs.score++;qs.fb=`✅ 정답! ${q.explanation}`;}
  else{qs.wrong.push(q.id);qs.fb=`❌ 오답. 정답: <strong>${q.options[q.answer]}</strong><br><small>${q.explanation}</small>`;S.quizWrongStats[q.id]=(S.quizWrongStats[q.id]||0)+1;}
  qs.ok=ok; rApp(); saveS();
}

async function essAns(){
  const ans=document.getElementById('ess')?.value.trim();
  if(!ans)return;
  const qs=S.quizState, q=qs.questions[qs.current];
  const btn=document.querySelector('button[onclick="essAns()"]');
  if(btn){btn.disabled=true;btn.textContent='채점 중...';}
  const res=await aiGrade(q.text,q.modelAnswer,ans);
  if(res.correct){qs.score++;qs.fb=`✅ ${res.feedback}`;}
  else{qs.wrong.push(q.id);qs.fb=`❌ ${res.feedback}<br><small>모범: ${q.modelAnswer}</small>`;S.quizWrongStats[q.id]=(S.quizWrongStats[q.id]||0)+1;}
  qs.ok=res.correct; rApp(); saveS();
}

function nextQ(){S.quizState.current++;S.quizState.fb='';S.quizState.ok=false;rApp();saveS();}

function quizPass(){
  const qs=S.quizState, s=S.students[S.currentSid];
  s.quizScore=qs.score; s.quizTotal=qs.questions.length; s.quizWrong=qs.wrong;
  s.licensed=true; s.licenseDate=nd()+' '+nt(); s.step='license';
  S.quizState=null; go('safety-license');
}

function startPractice(){S.students[S.currentSid].step='practice';S.students[S.currentSid].practiceStart=Date.now()/1000;go('safety-practice');}

async function chatSend(){
  const inp=document.getElementById('chat-in');
  const msg=inp?.value.trim(); if(!msg)return; inp.value='';
  const btn=document.getElementById('send-btn');
  if(btn){btn.disabled=true;btn.textContent='...';}
  const s=S.students[S.currentSid];
  const tools=S.selectedTools.map(tname);
  const hist=(s.chatLog||[]).flatMap(e=>[{role:'user',content:e.msg},...(e.resp?[{role:'assistant',content:JSON.stringify(e.resp)}]:[])]);
  const resp=await aiChat(msg,tools,hist);
  s.chatLog=[...(s.chatLog||[]),{time:nt(),msg,resp}];
  s.lastActive=Date.now()/1000;
  msg.split(/\s+/).filter(w=>w.length>=2).forEach(w=>{S.chatKeyStats[w]=(S.chatKeyStats[w]||0)+1;});
  go('safety-practice');
}

function doSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('크롬 브라우저에서만 음성 입력이 지원됩니다.');return;}
  const rec=new SR(); rec.lang='ko-KR';
  const btn=document.getElementById('stt-btn');
  if(btn){btn.textContent='🔴';}
  rec.onresult=e=>{const t=e.results[0][0].transcript;const inp=document.getElementById('chat-in');if(inp)inp.value=t;if(btn)btn.textContent='🎤';};
  rec.onerror=()=>{if(btn)btn.textContent='🎤';};
  rec.start();
}

function reportSubmit(){
  const q1=document.getElementById('r1')?.value.trim();
  const q2=document.getElementById('r2')?.value.trim();
  const q3=document.getElementById('r3')?.value.trim();
  if(!q1||!q2||!q3){document.getElementById('r-err').style.display='block';return;}
  S.students[S.currentSid].reflection={q1,q2,q3,submittedAt:nd()+' '+nt()};
  rApp(); saveS();
}

function toolToggle(id){
  const i=S.selectedTools.indexOf(id);
  if(i>=0)S.selectedTools.splice(i,1);else S.selectedTools.push(id);
  rApp(); saveS();
}

function classStart(){
  if(!S.selectedTools.length){alert('공구를 하나 이상 선택하세요.');return;}
  S.classActive=true; S.students={}; rApp(); saveS();
}

function doCSV(){
  const all=Object.values(S.students);
  const hdr=['학번','이름','학년','반','번호','퀴즈점수','퀴즈총수','면허','AI질문수','성찰제출'];
  const rows=all.map(s=>[s.sid,s.name,s.grade,s.cls,s.num,s.quizScore||0,s.quizTotal||0,s.licensed?'Y':'N',(s.chatLog||[]).length,s.reflection?.submittedAt?'Y':'N']);
  const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='활동기록.csv'; a.click();
}

// ─── INIT ─────────────────────────────────────────────
loadS();
S.teacherAuthed=false; S.currentSid=null; S.quizState=null; S.modal=null;
rNav(); rApp();
</script>
