// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function parseSid(sid) {
  if (!sid || sid.length !== 5 || !/^\d+$/.test(sid)) return null;
  return { grade: sid[0], cls: sid[1], num: parseInt(sid.slice(2)) };
}
function fmtSid(sid) {
  const p = parseSid(sid);
  return p ? `${p.grade}학년 ${p.cls}반 ${p.num}번` : '잘못된 학번';
}
function nowTime() { return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
function nowDate() { return new Date().toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})+' '+nowTime(); }
function toolName(id) {
  for (const c of Object.values(TOOLS_DATA)) { const t = c.items.find(i=>i.id===id); if(t) return t.name; }
  return id;
}
function filteredQs() {
  return S.selectedTools.length ? QUESTIONS.filter(q=>S.selectedTools.includes(q.tool)) : QUESTIONS;
}
function gradeEssay(model, student) {
  const kws = model.split(/[\s,。]+/).filter(w=>w.length>=2);
  const hit = kws.filter(k=>student.includes(k)).length;
  const ok = hit >= Math.max(1, Math.floor(kws.length/3));
  return { ok, fb: ok ? '핵심 내용을 잘 포함하고 있습니다.' : '모범답안의 핵심 내용을 다시 확인하세요.' };
}

// ═══════════════════════════════════════════════════════════════
//  AI (Cloudflare Worker 프록시 → 실패시 mock)
// ═══════════════════════════════════════════════════════════════
async function aiChat(msg, toolNames, history) {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, tools: toolNames, history }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    return data;
  } catch {
    return mockChat(msg);
  }
}

async function aiGrade(question, modelAnswer, studentAnswer) {
  try {
    const res = await fetch('/api/grade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, modelAnswer, studentAnswer }),
    });
    if (!res.ok) throw new Error();
    return await res.json();
  } catch {
    const r = gradeEssay(modelAnswer, studentAnswer);
    return { correct: r.ok, feedback: r.fb };
  }
}

function mockChat(msg) {
  for (const item of AI_MOCK) {
    if (item.keys.some(k => msg.includes(k))) return item.r;
  }
  return DEFAULT_RESP;
}

  app.innerHTML = (views[VIEW] || vHome)();

}

function doLogin() {
  const name = document.getElementById('inp-name')?.value.trim();
  const sid  = document.getElementById('inp-sid')?.value.trim();
  const err  = document.getElementById('login-err');
  const show = (m) => { err.textContent=m; err.classList.remove('hidden'); };

  if (!name) { show('이름을 입력하세요.'); return; }
  if (!parseSid(sid)) { show('학번은 5자리 숫자로 입력하세요.'); return; }
  if (S.students[sid] && S.students[sid].name !== name) { show('이미 다른 이름으로 등록된 학번입니다.'); return; }

  if (!S.students[sid]) {
    const p = parseSid(sid);
    S.students[sid] = { sid, name, grade:p.grade, cls:p.cls, num:p.num,
      quizScore:0, quizTotal:0, licensed:false, licenseDate:null,
      quizWrong:[], chatLog:[], step:'quiz',
      lastActive: Date.now()/1000, practiceStart:null, reflection:{} };
  }
  S.currentSid = sid;
  S.quizState = null;
  go('quiz');
}

function vQuiz() {
  if (!S.quizState) {
    S.quizState = { questions: filteredQs(), current:0, score:0, wrong:[], fb:'', ok:false };
  }
  const qs = S.quizState;
  const student = S.students[S.currentSid];

  if (qs.current >= qs.questions.length) {
    const pct = qs.score / qs.questions.length;
    const pass = pct >= 0.7;
    return `
      <div class="max-w-sm mx-auto text-center py-8">
        <div class="text-6xl mb-4">${pass?'🎉':'😢'}</div>
        <h2 class="text-2xl font-bold mb-2">${pass?'퀴즈 통과!':'아쉽게도 미달'}</h2>
        <p class="text-4xl font-bold text-blue-600 mb-1">${qs.score} / ${qs.questions.length}</p>
        <p class="text-gray-400 mb-6">${Math.round(pct*100)}% (기준: 70%)</p>
        ${pass
          ? `<button onclick="doQuizPass()" class="w-full bg-blue-500 text-white rounded-xl py-3 font-bold">🏅 면허증 발급받기 →</button>`
          : `<button onclick="S.quizState=null;go('quiz')" class="w-full bg-gray-500 text-white rounded-xl py-3 font-bold">🔄 다시 도전하기</button>`}
      </div>`;
  }

  const q   = qs.questions[qs.current];
  const pct = qs.current / qs.questions.length;

  return `
    <div>
      <h2 class="text-xl font-bold mb-1">📝 안전 퀴즈 — ${student?.name}님</h2>
      <div class="flex items-center gap-3 mb-5">
        <div class="flex-1 bg-gray-200 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full transition-all" style="width:${pct*100}%"></div>
        </div>
        <span class="text-sm text-gray-400">${qs.current+1}/${qs.questions.length}</span>
      </div>
      <div class="bg-white rounded-2xl shadow p-6">
        <p class="text-lg font-semibold mb-5">Q${qs.current+1}. ${q.text}</p>
        ${q.type==='mc' ? (qs.fb ? '' : q.options.map((o,i)=>`
          <button onclick="doMCAnswer(${i})" class="w-full text-left border hover:bg-blue-50 rounded-xl px-4 py-3 mb-2 transition">${String.fromCharCode(9312+i)} ${o}</button>
        `).join('')) : (qs.fb ? '' : `
          <textarea id="essay-in" rows="4" placeholder="답변을 입력하세요..." class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3"></textarea>
          <button onclick="doEssaySubmit()" class="w-full bg-blue-500 text-white rounded-xl py-3 font-bold">제출</button>
        `)}
        ${qs.fb ? `
          <div class="p-4 rounded-xl ${qs.ok?'bg-green-50 text-green-800':'bg-red-50 text-red-800'} text-sm mb-4">${qs.fb}</div>
          <button onclick="doNextQ()" class="w-full bg-blue-500 text-white rounded-xl py-3 font-bold">다음 문제 →</button>
        ` : ''}
      </div>
    </div>`;
}

function doMCAnswer(i) {
  const qs = S.quizState;
  const q  = qs.questions[qs.current];
  const ok = i === q.answer;
  if (ok) { qs.score++; qs.fb=`✅ 정답! ${q.explanation}`; }
  else { qs.wrong.push(q.id); qs.fb=`❌ 오답. 정답: <strong>${q.options[q.answer]}</strong><br><small>${q.explanation}</small>`; S.quizWrongStats[q.id]=(S.quizWrongStats[q.id]||0)+1; }
  qs.ok = ok; render();
}

async function doEssaySubmit() {
  const ans = document.getElementById('essay-in')?.value.trim();
  if (!ans) return;
  const qs = S.quizState;
  const q  = qs.questions[qs.current];
  const btn = document.querySelector('#essay-in + button');
  if (btn) { btn.disabled=true; btn.textContent='채점 중...'; }
  const res = await aiGrade(q.text, q.modelAnswer, ans);
  if (res.correct) { qs.score++; qs.fb=`✅ ${res.feedback}`; }
  else { qs.wrong.push(q.id); qs.fb=`❌ ${res.feedback}<br><small>모범: ${q.modelAnswer}</small>`; S.quizWrongStats[q.id]=(S.quizWrongStats[q.id]||0)+1; }
  qs.ok = res.correct; render();
}

function doNextQ() { S.quizState.current++; S.quizState.fb=''; S.quizState.ok=false; render(); }

function doQuizPass() {
  const qs = S.quizState;
  const s  = S.students[S.currentSid];
  s.quizScore = qs.score; s.quizTotal = qs.questions.length;
  s.quizWrong = qs.wrong; s.licensed = true; s.licenseDate = nowDate(); s.step='license';
  S.quizState = null; go('license');
}

async function doChatSend() {
  const input = document.getElementById('chat-in');
  const msg   = input?.value.trim();
  if (!msg) return;
  input.value = '';
  const btn = document.getElementById('send-btn');
  if (btn) { btn.disabled=true; btn.textContent='...'; }

  const s = S.students[S.currentSid];
  const toolNames = S.selectedTools.map(toolName);
  const history = (s.chatLog||[]).flatMap(e=>[
    {role:'user', content: e.msg},
    ...(e.resp ? [{role:'assistant', content: JSON.stringify(e.resp)}] : [])
  ]);

  const resp = await aiChat(msg, toolNames, history);
  s.chatLog = [...(s.chatLog||[]), { time: nowTime(), msg, resp }];
  s.lastActive = Date.now()/1000;

  msg.split(/\s+/).filter(w=>w.length>=2).forEach(w=>{
    S.chatKeyStats[w] = (S.chatKeyStats[w]||0)+1;
  });

  render();
}

function doSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('크롬 브라우저에서만 음성 입력이 지원됩니다.'); return; }
  const rec = new SR();
  rec.lang = 'ko-KR';
  const btn = document.getElementById('stt-btn');
  if (btn) { btn.textContent='🔴'; btn.classList.add('animate-pulse'); }
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    const inp = document.getElementById('chat-in');
    if (inp) inp.value = t;
    if (btn) { btn.textContent='🎤'; btn.classList.remove('animate-pulse'); }
  };
  rec.onerror = () => { if(btn){btn.textContent='🎤';btn.classList.remove('animate-pulse');} };
  rec.start();
}

      </div>
      <div class="grid grid-cols-5 gap-2 mb-4 text-center">
        ${[['전체',all.length,'blue'],['면허',all.filter(s=>s.licensed).length,'green'],['실습',all.filter(s=>s.step==='practice').length,'purple'],['제출',all.filter(s=>s.reflection?.submittedAt).length,'indigo'],['⚠️정체',staleList.length,'red']].map(([l,v,c])=>
          `<div class="bg-${c}-50 rounded-xl p-2"><p class="text-xs text-gray-400">${l}</p><p class="font-bold text-${c}-600 text-lg">${v}</p></div>`
        ).join('')}
      </div>
      ${staleList.length?`<div class="bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm mb-4">⚠️ 3분 이상 활동 없음: ${staleList.map(s=>s.name).join(', ')}</div>`:''}
      ${!all.length?`<p class="text-center text-gray-300 py-12">아직 접속한 학생이 없습니다.</p>`:`<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cards}</div>`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  VIEW: TEACHER STATS
// ═══════════════════════════════════════════════════════════════
function vTeacherStats() {
  const all = Object.values(S.students);
  const qMap = Object.fromEntries(QUESTIONS.map(q=>[q.id, q.text.slice(0,20)+'…']));

  const bar = (data, color) => {
    const top = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const max = top[0]?.[1]||1;
    return top.map(([k,v])=>`
      <div class="flex items-center gap-2 mb-2">
        <span class="text-xs text-gray-500 w-32 truncate">${qMap[k]||k}</span>
        <div class="flex-1 bg-gray-100 rounded-full h-5">
          <div class="bg-${color}-400 h-5 rounded-full flex items-center justify-end pr-2" style="width:${v/max*100}%">
            <span class="text-xs text-white font-bold">${v}</span>
          </div>
        </div>
      </div>`).join('') || '<p class="text-gray-300 text-sm">데이터 없음</p>';
  };

  const rows = all.sort((a,b)=>a.sid.localeCompare(b.sid)).map(s=>`
    <tr class="border-b text-sm hover:bg-gray-50">
      <td class="py-2 px-2">${s.sid}</td><td class="py-2 px-2">${s.name}</td>
      <td class="py-2 px-2">${s.quizScore||0}/${s.quizTotal||0}</td>
      <td class="py-2 px-2">${s.licensed?'✅':'❌'}</td>
      <td class="py-2 px-2">${(s.chatLog||[]).length}</td>
      <td class="py-2 px-2">${s.reflection?.submittedAt?'✅':'❌'}</td>
    </tr>`).join('');

  return `
    <div>
      ${teacherTabs('stats')}
      <h2 class="text-xl font-bold mb-4">📈 수업 통계</h2>
      <div class="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 class="font-bold mb-3">❌ 많이 틀린 문제 Top 5</h3>
        ${bar(S.quizWrongStats,'red')}
      </div>
      <div class="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 class="font-bold mb-3">💬 많이 질문한 키워드 Top 5</h3>
        ${bar(S.chatKeyStats,'blue')}
      </div>
      <div class="bg-white rounded-2xl shadow p-5">
        <h3 class="font-bold mb-3">👨‍🎓 학생별 이력</h3>
        ${!all.length?'<p class="text-gray-300 text-sm">데이터 없음</p>':`
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 text-xs text-gray-400"><tr>
                <th class="py-2 px-2 text-left">학번</th><th class="py-2 px-2 text-left">이름</th>
                <th class="py-2 px-2 text-left">퀴즈</th><th class="py-2 px-2 text-left">면허</th>
                <th class="py-2 px-2 text-left">AI질문</th><th class="py-2 px-2 text-left">성찰</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <button onclick="doCSV()" class="mt-3 bg-gray-100 hover:bg-gray-200 rounded-xl px-4 py-2 text-sm">📥 CSV 다운로드</button>`}
      </div>
    </div>`;
}

function doCSV() {
  const all = Object.values(S.students);
  const hdr = ['학번','이름','학년','반','번호','퀴즈점수','퀴즈총수','면허','취득일시','AI질문수','성찰제출'];
  const rows = all.map(s=>[s.sid,s.name,s.grade,s.cls,s.num,s.quizScore||0,s.quizTotal||0,s.licensed?'Y':'N',s.licenseDate||'',(s.chatLog||[]).length,s.reflection?.submittedAt?'Y':'N']);
  const csv = [hdr,...rows].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = 'students.csv'; a.click();
}

// ═══════════════════════════════════════════════════════════════
//  SHARED UI
// ═══════════════════════════════════════════════════════════════
function teacherTabs(active) {
  const tabs = [['setup','⚙️ 설정','teacher-setup'],['dash','📊 대시보드','teacher-dash'],['stats','📈 통계','teacher-stats']];
  return `
    <div class="flex gap-2 mb-5 flex-wrap">
      ${tabs.map(([id,label,view])=>`
        <button onclick="go('${view}')" class="text-sm px-4 py-2 rounded-xl font-medium transition ${active===id?'bg-blue-500 text-white':'bg-white border text-gray-500 hover:bg-gray-50'}">${label}</button>
      `).join('')}
      <button onclick="S.teacherAuthed=false;S.role=null;go(null)" class="ml-auto text-sm px-3 py-2 rounded-xl bg-gray-100 text-gray-500">로그아웃</button>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
loadS();
if (S.currentSid && S.students[S.currentSid]) {
  const step = S.students[S.currentSid].step;
  go(step === 'practice' ? 'practice' : step === 'report' ? 'report' : step === 'license' ? 'license' : 'quiz');
} else if (S.teacherAuthed) {
  go('teacher-setup');
} else {
  go(null);
}
</script>
